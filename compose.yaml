services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: agata-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1434:1433"
    volumes:
      - agata_sqlserver_data:/var/opt/mssql

  init-bd:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: agata-init-bd
    depends_on:
      - sqlserver
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
    volumes:
      - ./BD:/scripts:ro
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        SQLCMD="/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P $$SA_PASSWORD -C"
        for i in $$(seq 1 60); do
          $$SQLCMD -Q "SELECT 1" > /dev/null 2>&1 && break
          sleep 2
        done
        EXISTE=$$($$SQLCMD -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name = 'AgataMakeUpDB'")
        if [ "$$EXISTE" = "0" ]; then
          $$SQLCMD -f 65001 -b -i /scripts/AgataMakeUpDb_Unificada_Roles.sql -i /scripts/ProcedimientosAlmacenados.txt && echo "Base de datos AgataMakeUpDB creada"
        else
          echo "La base de datos AgataMakeUpDB ya existe"
        fi

volumes:
  agata_sqlserver_data:
